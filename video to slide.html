<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video to Slides Extractor - Improved</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
    video, #cropCanvas { max-width: 100%; background: #000; }
    #cropOverlay { position: absolute; border: 2px dashed #22c55e; pointer-events: none; }
  </style>
</head>
<body class="bg-gray-50 py-8">
  <div class="max-w-6xl mx-auto px-6">
    <h1 class="text-3xl font-semibold text-gray-800 mb-2">Video to Slides Extractor</h1>
    <p class="text-gray-600 mb-8">Crop Tool + Smart Scene Detection (ignores mouse & speaker movement)</p>

    <!-- Upload -->
    <div id="uploadArea" class="border-2 border-dashed border-gray-300 rounded-xl p-12 text-center hover:border-blue-400 transition-colors">
      <input type="file" id="videoInput" accept="video/*" class="hidden">
      <button onclick="document.getElementById('videoInput').click()" 
              class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-lg text-lg font-medium">
        Select Video File
      </button>
    </div>

    <div id="mainArea" class="hidden mt-8">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Video + Crop -->
        <div class="lg:col-span-2">
          <div class="relative">
            <video id="video" controls class="w-full rounded-xl shadow"></video>
            <canvas id="cropCanvas" class="hidden absolute top-0 left-0"></canvas>
          </div>

          <div class="mt-4 flex flex-wrap gap-3">
            <button onclick="captureCurrentFrame()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg font-medium">📸 Capture Current</button>
            <button onclick="toggleCropMode()" id="cropBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-lg font-medium">✂️ Define Slide Area (Crop)</button>
            <button onclick="startSceneDetection()" id="detectBtn" class="bg-violet-600 hover:bg-violet-700 text-white px-6 py-3 rounded-lg font-medium">🔍 Auto Detect Slides</button>
            <button onclick="clearAllSlides()" class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg font-medium">Clear All</button>
          </div>

          <!-- Sensitivity -->
          <div class="mt-5 bg-white p-4 rounded-xl border">
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Sensitivity: <span id="thresholdValue" class="font-mono">12</span>
            </label>
            <input type="range" id="thresholdSlider" min="5" max="30" value="12" class="w-full accent-violet-600">
            <div class="flex justify-between text-xs text-gray-500 mt-1">
              <span>More Sensitive</span><span>Less Sensitive</span>
            </div>
          </div>
        </div>

        <!-- Gallery -->
        <div>
          <h2 class="text-lg font-medium mb-3 flex justify-between">
            Extracted Slides (<span id="count">0</span>)
            <div class="flex gap-2">
              <button onclick="downloadPDF()" class="text-sm bg-red-600 text-white px-4 py-1.5 rounded hover:bg-red-700">📄 PDF</button>
              <button onclick="downloadZIP()" class="text-sm bg-white border border-gray-300 hover:bg-gray-50 px-4 py-1.5 rounded">ZIP</button>
            </div>
          </h2>
          <div id="slidesContainer" class="grid grid-cols-2 gap-3 max-h-[620px] overflow-y-auto pr-2"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let video = document.getElementById('video');
    let slides = [];
    let cropRect = null;           // {x, y, width, height}
    let isCropping = false;

    document.getElementById('videoInput').addEventListener('change', e => {
      video.src = URL.createObjectURL(e.target.files[0]);
      document.getElementById('uploadArea').classList.add('hidden');
      document.getElementById('mainArea').classList.remove('hidden');
    });

    // ====================== Crop Tool ======================
    function toggleCropMode() {
      isCropping = !isCropping;
      const btn = document.getElementById('cropBtn');
      btn.textContent = isCropping ? "✅ Confirm Crop Area" : "✂️ Define Slide Area (Crop)";

      if (isCropping) {
        alert("Pause the video on a clear slide.\nDrag on the video to select the main slide area (exclude presenter).");
      }
    }

    video.addEventListener('click', e => {
      if (!isCropping) return;
      // Simple click-to-crop (center 85% area) - can be enhanced later
      if (!cropRect) {
        cropRect = {
          x: Math.floor(video.videoWidth * 0.08),
          y: Math.floor(video.videoHeight * 0.08),
          width: Math.floor(video.videoWidth * 0.84),
          height: Math.floor(video.videoHeight * 0.84)
        };
        alert("Default central crop applied.\nYou can run detection now.\nClick 'Define Slide Area' again to reset.");
        isCropping = false;
        document.getElementById('cropBtn').textContent = "✂️ Define Slide Area (Crop)";
      }
    });

    // ====================== Capture & Detection ======================
    function getCroppedImageData(ctx, canvas) {
      if (!cropRect) {
        return ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      }
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = cropRect.width;
      tempCanvas.height = cropRect.height;
      const tctx = tempCanvas.getContext('2d');
      tctx.drawImage(canvas, cropRect.x, cropRect.y, cropRect.width, cropRect.height, 0, 0, cropRect.width, cropRect.height);
      return tctx.getImageData(0, 0, tempCanvas.width, tempCanvas.height).data;
    }

    function captureCurrentFrame() {
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
      addSlide(dataUrl, video.currentTime);
    }

    function addSlide(dataUrl, timestamp) {
      slides.push({ id: Date.now(), dataUrl, timestamp });
      renderSlide(slides[slides.length-1]);
      document.getElementById('count').textContent = slides.length;
    }

    function renderSlide(slide) {
      const div = document.createElement('div');
      div.className = "border border-gray-200 rounded-lg overflow-hidden bg-white";
      div.innerHTML = `
        <img src="${slide.dataUrl}" class="w-full h-auto cursor-pointer" onclick="showFullImage('${slide.dataUrl}')">
        <div class="p-2 text-xs text-gray-500 flex justify-between">
          <span>${Math.round(slide.timestamp)}s</span>
          <button onclick="removeSlide(${slide.id}); event.stopImmediatePropagation()" class="text-red-500 hover:text-red-700">Remove</button>
        </div>
      `;
      document.getElementById('slidesContainer').appendChild(div);
    }

    function removeSlide(id) {
      slides = slides.filter(s => s.id !== id);
      document.getElementById('count').textContent = slides.length;
      document.getElementById('slidesContainer').innerHTML = '';
      slides.forEach(renderSlide);
    }

    // Block-based difference (much better at ignoring mouse pointer)
    function calculateDifference(data1, data2, width, height) {
      const blockSize = 32;
      let changedBlocks = 0;
      let totalBlocks = 0;

      for (let y = 0; y < height; y += blockSize) {
        for (let x = 0; x < width; x += blockSize) {
          let diff = 0;
          let count = 0;
          const maxX = Math.min(x + blockSize, width);
          const maxY = Math.min(y + blockSize, height);

          for (let by = y; by < maxY; by++) {
            for (let bx = x; bx < maxX; bx++) {
              const i = (by * width + bx) * 4;
              diff += Math.abs(data1[i] - data2[i]) + Math.abs(data1[i+1] - data2[i+1]) + Math.abs(data1[i+2] - data2[i+2]);
              count += 3;
            }
          }
          if (diff / count > 18) changedBlocks++;   // threshold per block
          totalBlocks++;
        }
      }
      return changedBlocks / totalBlocks;   // return percentage of changed blocks
    }

    async function startSceneDetection() {
      if (video.duration <= 0) return alert("Please play the video first.");
      
      const threshold = parseFloat(document.getElementById('thresholdSlider').value) / 100;
      let currentTime = 0;
      const interval = 0.7;
      let previousData = null;
      let progressDiv = document.createElement('div');
      progressDiv.innerHTML = `<p class="text-sm text-violet-600">Running smart scene detection...</p>`;
      document.querySelector('.lg\\:col-span-2').appendChild(progressDiv);

      while (currentTime < video.duration) {
        video.currentTime = currentTime;
        await new Promise(r => setTimeout(r, 70));

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0);

        const currentData = getCroppedImageData(ctx, canvas);

        if (previousData) {
          const changeRatio = calculateDifference(previousData, currentData, 
            cropRect ? cropRect.width : canvas.width, 
            cropRect ? cropRect.height : canvas.height);

          if (changeRatio > threshold) {
            addSlide(canvas.toDataURL('image/jpeg', 0.94), currentTime);
          }
        }
        previousData = currentData;
        currentTime += interval;
      }

      progressDiv.remove();
      video.currentTime = 0;
      alert(`Detection completed! Extracted ${slides.length} slides.`);
    }

    function clearAllSlides() {
      if (confirm('Clear all slides?')) {
        slides = [];
        document.getElementById('slidesContainer').innerHTML = '';
        document.getElementById('count').textContent = '0';
      }
    }

    async function downloadPDF() {
      if (slides.length === 0) return alert("No slides.");
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('landscape', 'pt', 'a4');
      const w = pdf.internal.pageSize.getWidth();
      const h = pdf.internal.pageSize.getHeight();

      for (let i = 0; i < slides.length; i++) {
        if (i > 0) pdf.addPage();
        const img = new Image();
        img.src = slides[i].dataUrl;
        await new Promise(res => { img.onload = () => {
          const ratio = Math.min(w/img.width, h/img.height);
          pdf.addImage(img, 'JPEG', (w - img.width*ratio)/2, (h - img.height*ratio)/2, img.width*ratio, img.height*ratio);
          res();
        }});
      }
      pdf.save("presentation_slides.pdf");
    }

    function downloadZIP() {
      if (slides.length === 0) return alert("No slides.");
      const zip = new JSZip();
      slides.forEach((s, i) => {
        zip.file(`slide_${String(i+1).padStart(3,'0')}.jpg`, s.dataUrl.split(',')[1], {base64:true});
      });
      zip.generateAsync({type:"blob"}).then(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "slides.zip";
        a.click();
      });
    }

    function showFullImage(url) {
      const w = window.open();
      w.document.write(`<img src="${url}" style="max-width:100%; height:auto;">`);
    }
  </script>
</body>
</html>
